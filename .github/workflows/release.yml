name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          cd extension
          zip -r "../zhiqian-extension-${GITHUB_REF_NAME}.zip" .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" zhiqian-extension-*.zip --generate-notes --title "${GITHUB_REF_NAME}"
